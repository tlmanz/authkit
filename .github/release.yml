# Categories for the change list GitHub generates under each release's written
# notes (the release workflow passes --generate-notes). A merged PR lands in the
# first category whose label it carries.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Security
      labels:
        - security
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
