name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet (core)
        run: go vet ./...

      - name: Test (core, race + coverage)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      - name: Vet (redisstore)
        working-directory: redisstore
        run: go vet ./...

      - name: Test (redisstore, race)
        working-directory: redisstore
        run: go test -race ./...

      - name: Coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: cover.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint (core)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: golangci-lint (redisstore)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: redisstore

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck (core)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: govulncheck (redisstore)
        working-directory: redisstore
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
